<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lino Bata — Videógrafo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#ff3800;
    --accent2:#ff8a3d;
    --bg:#08080a;
    --bg2:#131315;
    --card:#141416;
    --card-h:#1c1c1f;
    --line:#26262a;
    --text:#f6f4ef;
    --muted:#8d897f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(900px 520px at 12% -10%, rgba(255,56,0,0.18), transparent 60%),
      radial-gradient(700px 500px at 112% 8%, rgba(255,138,61,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',Arial,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    -webkit-font-smoothing:antialiased;
  }

  .frame{
    position:relative;
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg, rgba(255,255,255,0.025), transparent 22%), var(--bg2);
    border:1px solid var(--line);
    border-radius:28px;
    padding:24px 22px 26px;
    box-shadow:0 30px 60px -30px rgba(0,0,0,0.6);
  }
  .corners span{
    position:absolute;
    width:16px;height:16px;
    border-color:var(--accent);
    border-style:solid;
    opacity:.8;
  }
  .corners span:nth-child(1){top:14px;left:14px;border-width:2px 0 0 2px;border-top-left-radius:6px;}
  .corners span:nth-child(2){top:14px;right:14px;border-width:2px 2px 0 0;border-top-right-radius:6px;}
  .corners span:nth-child(3){bottom:14px;left:14px;border-width:0 0 2px 2px;border-bottom-left-radius:6px;}
  .corners span:nth-child(4){bottom:14px;right:14px;border-width:0 2px 2px 0;border-bottom-right-radius:6px;}

  .hud{
    display:flex;align-items:center;justify-content:space-between;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;color:var(--muted);
    letter-spacing:1px;
    margin-bottom:24px;
    padding:2px 6px 0;
  }
  .rec{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:500;}
  .dot{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,56,0,.55);}
    70%{box-shadow:0 0 0 7px rgba(255,56,0,0);}
    100%{box-shadow:0 0 0 0 rgba(255,56,0,0);}
  }

  .hero{text-align:center;margin-bottom:28px;}
  .avatar{
    width:118px;height:118px;border-radius:50%;
    margin:0 auto 18px;
    background:conic-gradient(from 220deg, var(--accent), var(--accent2), var(--accent));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 1px rgba(255,255,255,0.04), 0 18px 30px -14px rgba(255,56,0,0.45);
    animation:fadeUp .6s ease both;
  }
  .avatar img{
    width:108px;height:108px;border-radius:50%;
    object-fit:cover;
    object-position:center 28%;
    display:block;
    border:3px solid var(--bg2);
  }
  h1{
    font-family:'Anton',sans-serif;
    font-size:33px;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
    line-height:1;
    animation:fadeUp .6s ease .05s both;
  }
  .role{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--accent2);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:500;
    text-transform:uppercase;letter-spacing:3px;
    margin-top:11px;
    animation:fadeUp .6s ease .1s both;
  }
  .role::before,.role::after{content:'';width:14px;height:1px;background:var(--accent2);opacity:.6;}

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  .links{display:flex;flex-direction:column;gap:10px;}
  a.btn{
    display:flex;align-items:center;gap:13px;
    width:100%;padding:14px 15px;
    border-radius:16px;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--text);
    text-decoration:none;
    font-size:14.5px;font-weight:600;
    text-align:left;
    transition:transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    opacity:0;
    animation:fadeUp .5s ease both;
    -webkit-user-select:none;user-select:none;
  }
  a.btn:nth-of-type(1){animation-delay:.16s;}
  a.btn:nth-of-type(2){animation-delay:.22s;}
  a.btn:nth-of-type(3){animation-delay:.28s;}
  a.btn:nth-of-type(4){animation-delay:.34s;}
  a.btn:nth-of-type(5){animation-delay:.4s;}

  a.btn:active{transform:scale(.96);}
  a.btn:hover{background:var(--card-h);border-color:#38383d;}

  a.btn.primary{
    background:linear-gradient(135deg,var(--accent),#ff5a1f);
    border-color:transparent;color:#0c0a09;
  }
  a.btn.primary:hover{filter:brightness(1.05);}

  a.btn.whatsapp:hover{border-color:#25d366;box-shadow:0 8px 22px -14px rgba(37,211,102,.55);}
  a.btn.instagram:hover{border-color:var(--accent);box-shadow:0 8px 22px -14px rgba(255,56,0,.55);}
  a.btn.youtube:hover{border-color:#ff0000;box-shadow:0 8px 22px -14px rgba(255,0,0,.55);}
  a.btn.call:hover{border-color:var(--accent2);box-shadow:0 8px 22px -14px rgba(255,138,61,.55);}

  .icon{
    width:38px;height:38px;flex:none;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.05);
    transition:transform .15s ease;
  }
  a.btn:hover .icon{transform:scale(1.06) rotate(-3deg);}
  a.btn.primary .icon{background:rgba(0,0,0,0.15);}
  .icon svg{width:18px;height:18px;}

  .txt{flex:1;min-width:0;}
  .txt small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;margin-top:1px;}
  a.btn.primary .txt small{color:rgba(0,0,0,.6);}
  .chev{flex:none;color:var(--muted);opacity:.55;}
  a.btn.primary .chev{color:rgba(0,0,0,.5);}

  footer{
    margin-top:24px;text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;letter-spacing:2px;color:var(--muted);
    text-transform:uppercase;
  }
  footer span{color:var(--accent2);}
</style>
</head>

    const s = totalSec % 60;
    const m = Math.floor(totalSec / 60) % 60;
    const h = Math.floor(totalSec / 3600);
    const pad = n => String(n).padStart(2,'0');

  }, 1000/24);
